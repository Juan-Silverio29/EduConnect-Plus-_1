{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-warning text-dark">
      <h3 class="mb-0">Entregar tarea: {{ tarea.titulo }}</h3>
    </div>
    <div class="card-body">
      <p><strong>Curso:</strong> {{ tarea.curso.nombre }}</p>
      <p><strong>Fecha límite:</strong> {{ tarea.fecha_entrega|date:"d/m/Y H:i" }}</p>

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <label for="texto" class="form-label">Comentario o descripción</label>
          <textarea id="texto" name="texto" class="form-control" rows="5" placeholder="Describe lo que entregas..."></textarea>
        </div>

        <div class="mb-3">
          <label for="archivo" class="form-label">Archivo (opcional)</label>
          <input type="file" id="archivo" name="archivo" class="form-control">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success">Guardar entrega</button>
          <a href="{% url 'dashboard:detalle_tarea' tarea.id %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
